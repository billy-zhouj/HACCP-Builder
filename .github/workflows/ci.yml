# 每次 push / PR 都跑的静态门禁：类型检查 + SOP 模板解析器契约测试。
#
# 这些检查都不需要数据库、网络或密钥，因此 CI 无需 provision Postgres。
# `prisma generate` 只是为了让 tsc 能解析 @prisma/client 的生成类型。
#
# 生产构建（npm run build）由 Render 的部署流水线负责，这里不重复。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Type check
        run: npm run typecheck

      - name: Test (SOP templates × markdown parser contract)
        run: npm test
